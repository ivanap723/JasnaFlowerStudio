<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Jasna Flower Studio</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <style>
    .contact-form { display: grid; gap: var(--space-md); max-width: 500px; }
    .contact-form label { display: grid; gap: var(--space-xs); }
    .contact-form input, .contact-form textarea {
      padding: var(--space-sm) var(--space-md);
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font: inherit;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <header class="page-header">
    <h2 class="page-title page-title-display">Contact</h2>
  </header>
  <main class="container">
    <form id="contact-form" class="contact-form">
      <label>Name <input type="text" name="name" required></label>
      <label>Email <input type="email" name="email" required></label>
      <label>Message <textarea name="message" rows="5" required></textarea></label>
      <button class="button" type="submit">Send</button>
      <p id="form-status" role="status" class="muted"></p>
    </form>
  </main>
  <script src="js/layout.js"></script>
  <script src="js/glitter.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
