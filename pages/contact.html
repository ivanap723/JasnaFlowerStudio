<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt | Jasna Flower Studio</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    .contact-form { display: grid; gap: var(--space-md); max-width: 500px; }
    .contact-form label { display: grid; gap: var(--space-xs); }
    .contact-form input, .contact-form textarea {
      padding: var(--space-sm) var(--space-md);
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font: inherit;
    }
    /* Contact details sit at the bottom center of the page. */
    body { display: flex; flex-direction: column; }
    .contact-info { margin-top: auto; padding: var(--space-lg) var(--space-md); text-align: center; }
    .contact-info p { margin: 0 0 var(--space-xs); }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <header class="page-header">
    <h2 class="page-title page-title-display">Kontakt</h2>
  </header>
  <main class="container">
    <p class="text-highlight">Ako imaš bilo kakve upite, slobodno nam piši!</p>
    <form id="contact-form" class="contact-form">
      <label>Upiši svoje ime: <input type="text" name="name" required></label>
      <label>Upiši svoj email: <input type="email" name="email" required></label>
      <label>Tekst poruke <textarea name="message" rows="5" required></textarea></label>
      <button class="button" type="submit">Pošalji mejl</button>
      <p id="form-status" role="status" class="muted"></p>
    </form>
  </main>
  <footer class="contact-info">
    <p>Adresa: Ulica 123, Zrenjanin</p>
    <p>Email adresa: <a href="mailto:jasnaflowershop@email.com">jasnaflowershop@email.com</a></p>
  </footer>
  <script src="../js/layout.js"></script>
  <script src="../js/glitter.js"></script>
  <script src="../js/contact.js"></script>
</body>
</html>
